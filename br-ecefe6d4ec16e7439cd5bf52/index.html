<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Busch Report Builder</title>
<style>
:root{color-scheme:light;--orange:#ff5a00;--ink:#1b1b1b;--mute:#666;--line:#d9d9d9;--bg:#eceff1;--card:#fff;--ui:#2b2f33}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button,input,select,textarea{font:inherit}
/* ---------- app shell ---------- */
#app{display:flex;flex-direction:column;height:100vh}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--ui);color:#fff}
#bar .brand{font-weight:700;margin-right:6px}
#bar .brand b{color:var(--orange)}
#bar .sp{flex:1}
.btn{border:0;border-radius:6px;padding:7px 12px;background:#454b51;color:#fff;cursor:pointer;font-size:13px}
.btn:hover{background:#565d64}
.btn.pri{background:var(--orange)}
.btn.pri:hover{background:#e04e00}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ghost{background:#e5e8ea;color:#222}
.btn.ghost:hover{background:#d5d9dc}
.btn.del{background:#f3d6d3;color:#8a1c12}
.seg{display:inline-flex;border-radius:6px;overflow:hidden}
.seg button{border-radius:0;margin:0;border-right:1px solid #33383c}
.seg button.on{background:var(--orange)}
#status{font-size:12px;opacity:.85}
#split{flex:1;display:flex;min-height:0}
#edit{width:44%;min-width:340px;overflow:auto;padding:12px;background:var(--bg)}
#prevPane{flex:1;overflow-y:auto;overflow-x:hidden;background:#7b838a;padding:16px 0}
body.mode-edit #prevPane{display:none}body.mode-edit #edit{width:100%}
body.mode-prev #edit{display:none}
@media (max-width:900px){#edit{width:100%}body.mode-split #prevPane{display:none}}
/* ---------- editor ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .full{grid-column:1/-1}
label.f{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:2px;padding:6px 8px;border:1px solid #bfc5ca;border-radius:5px;background:#fff;color:var(--ink);font-size:14px;text-transform:none;letter-spacing:0}
label.f textarea{resize:vertical;min-height:70px;line-height:1.4}
.sec{border-left:4px solid var(--orange)}
.sec .hd{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.sec .hd input{flex:1;font-weight:700;padding:6px 8px;border:1px solid #bfc5ca;border-radius:5px}
.blk{border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0;background:#fafbfb}
.blk .bh{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--mute);text-transform:uppercase}
.blk .bh span{flex:1}
.adds{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-bottom:4px}
.row2 input{padding:5px 7px;border:1px solid #bfc5ca;border-radius:5px;min-width:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.th{border:1px solid var(--line);border-radius:6px;padding:6px;background:#fff}
.th img{width:100%;height:90px;object-fit:cover;border-radius:4px;display:block}
.th textarea{width:100%;margin-top:4px;min-height:48px;padding:4px;border:1px solid #bfc5ca;border-radius:4px;font-size:12px;resize:vertical}
.th .tb{display:flex;gap:4px;margin-top:4px}
.vibgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:4px;align-items:center;font-size:12px}
.vibgrid input{padding:5px;border:1px solid #bfc5ca;border-radius:5px;min-width:0;width:100%}
.hint{font-size:12px;color:var(--mute);margin:4px 0}
.chk{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:4px}
/* ---------- the paper (preview == PDF) ---------- */
#scaler{transform-origin:top left;width:794px}
.page{position:relative;width:210mm;height:297mm;background:#fff;color:#000;margin:0 0 18px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;font-size:10.5pt;line-height:1.38;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pg-head{position:absolute;left:16mm;right:16mm;top:10mm;height:16mm;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid var(--orange);padding-bottom:2mm}
.pg-head img{height:11mm;display:block}
.pg-head .ref{font-size:8pt;color:#444;text-align:right;line-height:1.3}
.pg-body{position:absolute;left:16mm;right:16mm;top:31mm;height:232mm;overflow:hidden}
.pg-foot{position:absolute;left:16mm;right:16mm;bottom:5mm;font-size:5.8pt;line-height:1.35;color:#222;border-top:1px solid #bbb;padding-top:1.2mm}
.pg-foot .pn{text-align:right;font-size:8pt;color:#000;margin-bottom:.8mm}
.pg-foot .l1{font-size:7pt;margin-bottom:1.4mm}
.pg-foot .l2{display:grid;grid-template-columns:34mm 1fr;gap:3mm;font-size:6.8pt;margin-bottom:1.4mm}
.pg-foot .sep{margin:0 1.2mm}
.pg-foot a{color:#0b5cad;text-decoration:underline}
.pg-foot .world{font-size:5.6pt;color:#444}
.doc-title{font-size:17pt;font-weight:700;text-align:center;margin:2mm 0 6mm;line-height:1.2}
.hdr{display:grid;grid-template-columns:23mm 1fr 14mm 52mm;column-gap:2mm;row-gap:1.2mm;font-size:10pt;margin-bottom:3mm}
.hdr .k{font-weight:700}
.hdr .full{grid-column:2/-1}
.hdr.subj{border-top:1px solid #999;padding-top:3mm;grid-template-columns:23mm 1fr}
.hdr .v{word-break:break-word}
.revbox{border:1px solid #999;padding:2mm 3mm;font-size:9pt;margin-bottom:4mm;background:#fff6ef}
.p{margin:0 0 3mm;white-space:pre-wrap;overflow-wrap:break-word}
.h1{font-size:12.5pt;font-weight:700;text-transform:uppercase;margin:4mm 0 3mm;padding-bottom:1mm;border-bottom:1.5px solid var(--orange);break-after:avoid}
.items{margin:0 0 4mm}
.items div{display:grid;grid-template-columns:20mm 1fr;margin-bottom:1.2mm}
.items b{font-weight:700}
ul.bl{margin:0 0 3mm;padding-left:6mm}
ul.bl li{margin-bottom:1mm;white-space:pre-wrap}
table.kv,table.vib{border-collapse:collapse;margin:0 0 3mm;font-size:10pt}
table.kv td{padding:.8mm 3mm .8mm 0;vertical-align:top}
table.kv td:first-child{width:60mm;font-weight:700}
table.vib{width:100%}
table.vib th,table.vib td{border:1px solid #777;padding:1.2mm 2mm;text-align:center}
table.vib th{background:#f0f0f0}
table.vib td:first-child,table.vib th:first-child{text-align:left}
.note{font-size:9pt;color:#222;margin:0 0 3mm;white-space:pre-wrap}
.phrow{display:flex;gap:4mm;margin-bottom:4mm;align-items:flex-start}
.ph{break-inside:avoid}
.ph .im{width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{display:block}
.ph .cap{font-size:9pt;margin-top:1.2mm;white-space:pre-wrap;color:#222}
.sign{margin-top:8mm;display:grid;grid-template-columns:1fr 1fr;gap:8mm;font-size:10pt}
.sign .nm{font-weight:700}
.sign .ph2{white-space:pre-wrap}
.measure{position:absolute;left:-9999px;top:0}
/* ---------- print: only the pages, exactly as previewed ---------- */
@page{size:A4;margin:0}
@media print{
  html,body{height:auto;background:#fff}
  #bar,#edit,#toast{display:none!important}
  #app,#split{display:block;height:auto}
  #prevPane{display:block!important;overflow:visible;padding:0;background:#fff}
  #scaler{transform:none!important;width:auto}
  .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;max-width:90%;z-index:9;display:none;font-size:13px}
</style>
</head>
<body class="mode-split">
<div id="app">
  <div id="bar">
    <span class="brand"><b>BUSCH</b> Report Builder</span>
    <button class="btn" id="bNew">New report</button>
    <button class="btn" id="bOpen">Open…</button>
    <input type="file" id="fOpen" accept=".html,.htm,.json" hidden>
    <button class="btn" id="bSave">Save HTML</button>
    <button class="btn" id="bRev">Save as new Rev.</button>
    <button class="btn pri" id="bPdf">Download PDF</button>
    <span class="sp"></span>
    <span id="status"></span>
    <span class="seg"><button class="btn" data-m="edit">Edit</button><button class="btn on" data-m="split">Split</button><button class="btn" data-m="prev">Preview</button></span>
  </div>
  <div id="split">
    <div id="edit"></div>
    <div id="prevPane"><div id="scaler"><div id="pages"></div></div></div>
  </div>
</div>
<div id="toast"></div>
<script type="application/json" id="saved-data"></script>

  h.appendChild(el("div",{class:"k",text:"COMPANY"}));h.appendChild(el("div",{class:"v",text:": "+esc(S.company)}));
  h.appendChild(el("div",{class:"k",text:"PHONE"}));h.appendChild(el("div",{class:"v",text:": "+esc(S.phone)}));
  h.appendChild(el("div",{class:"k",text:"FROM"}));h.appendChild(el("div",{class:"v",text:": "+P.name}));
  h.appendChild(el("div",{class:"k",text:"DATE"}));h.appendChild(el("div",{class:"v",text:": "+fmtDate(S.date)}));
  if(S.cc||S.ccEmail){
    h.appendChild(el("div",{class:"k",text:"CC"}));h.appendChild(el("div",{class:"v",text:": "+esc(S.cc)}));
    h.appendChild(el("div",{class:"k",text:"EMAIL"}));h.appendChild(el("div",{class:"v",text:": "+esc(S.ccEmail)}));
  }
  U.push({e:h});
  var sj=el("div",{class:"hdr subj"});
  sj.appendChild(el("div",{class:"k",text:"SUBJECT"}));sj.appendChild(el("div",{class:"v",text:": "+T(S.subject)}));
  sj.appendChild(el("div",{class:"k",text:"BUSCH REF"}));sj.appendChild(el("div",{class:"v",text:": "+esc(S.ref)+" Rev."+esc(S.rev)}));
  sj.appendChild(el("div",{class:"k",text:"YOUR REF"}));sj.appendChild(el("div",{class:"v",text:": "+esc(S.yourRef)}));
  U.push({e:sj});
  if(+S.rev>0&&S.revNote)U.push({e:el("div",{class:"revbox"},[el("b",{text:"Revision "+S.rev+": "}),S.revNote])});
  var first=(S.attn||"").trim().split(/\s+/)[0];
  U.push({e:el("p",{class:"p",text:(S.greeting||"Good day")+(first?" "+first:"")})});
  S.intro.split(/\n{2,}/).forEach(function(t){if(t.trim())U.push({e:el("p",{class:"p",text:T(t.trim())})});});
  U.push({e:el("div",{class:"h1",text:"1. ITEMS OF DISCUSSION"}),keep:true});
  var it=el("div",{class:"items"});
  S.sections.forEach(function(s,i){it.appendChild(el("div",{},[el("b",{text:"Item "+(i+2)}),"- "+T(s.title)]));});
  U.push({e:it});
  S.sections.forEach(function(s,si){
    U.push({e:el("div",{class:"h1",text:(si+2)+". "+T(s.title)}),keep:true,brk:si===0||!!s.newPage});
    s.blocks.forEach(function(b){blockUnits(b).forEach(function(u){U.push(u);});});
  });
  /* sign-off */
  var sg=el("div",{class:"sign"},S.signers.filter(function(k){return PEOPLE[k];}).sort(function(a,b){return (b===S.from)-(a===S.from);}).map(function(k){var q=PEOPLE[k];
    return el("div",{},[el("div",{class:"nm",text:q.name}),q.title,el("br"),q.region,el("br"),"Mob: "+q.mob,el("br"),q.email]);}));
  U.push({e:el("p",{class:"p",text:"Should you require any further assistance, please contact me.",style:"margin-top:6mm"}),keep:true});
  U.push({e:sg});
  return U;
}
function blockUnits(b){
  var out=[];
  if(b.t==="text"){
    (b.text||"").split(/\n{2,}/).forEach(function(t){if(t.trim()!=="")out.push({e:el("p",{class:"p",text:T(t.replace(/^\n+|\n+$/g,""))})});});
  }else if(b.t==="bullets"){
    var items=(b.text||"").split("\n").filter(function(x){return x.trim();});
    items.forEach(function(x){out.push({e:el("ul",{class:"bl"},[el("li",{text:T(x.replace(/^[\-•*]\s*/,""))})])});});
  }else if(b.t==="kv"){
    var tb=el("table",{class:"kv"});
    b.rows.forEach(function(r){if(!r[0]&&!r[1])return;tb.appendChild(el("tr",{},[el("td",{text:T(r[0])}),el("td",{text:"- "+T(r[1])})]));});
    out.push({e:tb});
  }else if(b.t==="vib"){
    var t=el("table",{class:"vib"});
    t.appendChild(el("tr",{},[el("th",{text:"BEARING VIBRATION"}),el("th",{text:"Axial"}),el("th",{text:"Horizontal"}),el("th",{text:"Vertical"})]));
    [["Drive end",b.de],["Non-drive end",b.nde]].forEach(function(r){t.appendChild(el("tr",{},[el("td",{text:r[0]}),el("td",{text:r[1][1]}),el("td",{text:r[1][2]}),el("td",{text:r[1][3]})]));});
    out.push({e:t,keep:!!b.note});
    if(b.note)out.push({e:el("div",{class:"note",text:T(b.note)})});
  }else if(b.t==="photos"){
    /* each photo has its own height; photos share a row while they fit (and the per-row limit allows) */
    var n=Math.max(1,b.cols||2),W=178*MM,G=4*MM,rows=[],cur=[],curW=0;
    var size=function(it){var d=DIMS[it.src]||[4,3],h=(it.h||DEFH)*MM,w=d[0]/d[1]*h;if(w>W){w=W;h=w*d[1]/d[0];}return [Math.round(w),Math.round(h)];};
    b.items.forEach(function(it){
      var w=size(it)[0];
      if(cur.length&&(it.alone||cur[cur.length-1].alone||cur.length>=n||curW+G+w>W+1)){rows.push(cur);cur=[];curW=0;}
      cur.push(it);curW+=(cur.length>1?G:0)+w;
    });
    if(cur.length)rows.push(cur);
    rows.forEach(function(r){
      var row=el("div",{class:"phrow"});
      r.forEach(function(it){
        var s=size(it),im=el("img",{src:it.src});im.style.width=s[0]+"px";im.style.height=s[1]+"px";
        row.appendChild(el("div",{class:"ph",style:"width:"+s[0]+"px"},[im,it.cap?el("div",{class:"cap",text:T(it.cap)}):null]));
      });
      out.push({e:row});
    });
  }
  return out;
}
var DEFH=70,DIMS={},MM=96/25.4,rpToken=0;
function renderPreview(){
  var tok=++rpToken,need=[];
  S.sections.forEach(function(s){s.blocks.forEach(function(b){if(b.t==="photos")b.items.forEach(function(it){if(!DIMS[it.src]&&need.indexOf(it.src)<0)need.push(it.src);});});});
  if(!need.length)return drawPages();
  var left=need.length;
  need.forEach(function(src){
    var im=new Image();
    var done=function(w,h){DIMS[src]=[w||4,h||3];if(--left===0&&tok===rpToken)drawPages();};
    im.onload=function(){done(im.naturalWidth,im.naturalHeight);};im.onerror=function(){done(4,3);};
    im.src=src;
  });
}
function drawPages(){
  if(!document.getElementById("prevPane").offsetWidth)return;   /* pane hidden (narrow screen, Edit mode): measured when shown */
  var host=document.getElementById("pages");host.textContent="";
  var units=unitsFor(),pages=[],cur=mkPage();
  host.appendChild(cur.pg);pages.push(cur);
  var newPage=function(){cur=mkPage();host.appendChild(cur.pg);pages.push(cur);return cur;};
  var over=function(){return cur.body.scrollHeight>cur.body.clientHeight+1;};
  var prevU=null;
  units.forEach(function(u){
    if(u.brk&&cur.body.children.length)newPage();
    cur.body.appendChild(u.e);
    if(over()&&cur.body.children.length>1){
      cur.body.removeChild(u.e);
      var carry=null;
      if(prevU&&prevU.keep&&cur.body.lastChild===prevU.e){carry=prevU.e;cur.body.removeChild(carry);}
      newPage();
      if(carry)cur.body.appendChild(carry);
      cur.body.appendChild(u.e);
    }
    prevU=u;
  });
  pages.forEach(function(p,i){p.pg.querySelector(".pn").textContent="Page "+(i+1)+" of "+pages.length;});
  fitScale();
}
function fitScale(){
  var pane=document.getElementById("prevPane"),sc=document.getElementById("scaler"),pg=document.getElementById("pages");
  var s=Math.min(1,(pane.clientWidth-24)/794);if(!(s>0))s=1;
  sc.style.transform="scale("+s+")";
  sc.style.marginLeft=Math.max(12,(pane.clientWidth-794*s)/2)+"px";
  sc.style.height=(pg.offsetHeight*s)+"px";
}

/* ---------- save / open / pdf ---------- */
function fileBase(){
  var t=(S.ref?S.ref+" Rev."+S.rev:"Busch Report Rev."+S.rev)+(S.subject?" - "+T(S.subject):"");
  return t.replace(/[\\\/:*?"<>|\r\n]+/g," ").replace(/\s+/g," ").trim().slice(0,120);
}
function saveHtml(){
  var json=JSON.stringify(S).replace(/</g,"\\u003c");
  var out=SRC.replace(/(<script type="application\/json" id="saved-data">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+json+b;});
  download(fileBase()+".html",out,"text/html");
  dirty=false;setStatus();
  toast("Saved. Double-click the downloaded .html any time to reopen and edit this report.");
}
function download(name,text,type){
  var a=el("a",{href:URL.createObjectURL(new Blob([text],{type:type+";charset=utf-8"})),download:name});
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function openFile(f){
  var r=new FileReader();
  r.onload=function(){
    var txt=r.result,data=null;
    try{
      if(/\.json$/i.test(f.name))data=JSON.parse(txt);
      else{var m=/<script type="application\/json" id="saved-data">([\s\S]*?)<\/script>/.exec(txt);if(m&&m[1].trim())data=JSON.parse(m[1]);}
    }catch(e){}
    if(!data||!data.sections){toast("That file doesn't contain a Busch report.");return;}
    backupDraft();S=normalise(data);embedded=false;dirty=false;lastSaved="";autosave();renderEditor();renderPreview();setStatus();toast("Opened "+f.name);
  };
  r.readAsText(f);
}
function pdf(){
  var old=document.title;document.title=fileBase();
  toast("In the print window choose 'Save as PDF', Paper A4, Margins: None, and untick 'Headers and footers'.");
  setTimeout(function(){window.print();document.title=old;},400);
}
function newRev(){
  var n=(parseInt(S.rev,10)||0)+1;
  if(!confirm("Create Rev."+n+" from this report? A file for Rev."+n+" will be saved; your earlier saved file stays untouched."))return;
  S.rev=String(n);renderEditor();renderPreview();saveHtml();
}

/* ---------- start-up ---------- */
(function init(){
  var raw=document.getElementById("saved-data").textContent.trim();
  if(raw){try{S=JSON.parse(raw);embedded=true;}catch(e){}}
  if(!S){try{var d=localStorage.getItem(DRAFT_KEY);if(d)S=JSON.parse(d);}catch(e){}}
  if(!S)S=newReport("test","andre");
  S=normalise(S);
  if(!embedded){
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
    idbGet("draft").then(function(d){if(d&&d.sections&&!dirty){S=normalise(d);lastSaved=JSON.stringify(S);renderEditor();renderPreview();setStatus();}}).catch(function(){});
  }
  document.getElementById("bNew").onclick=function(){
    if(!confirm(embedded?"Start a new report? Save HTML first if you want to keep this one.":"Start a new report? Your current draft is kept as the 'previous' backup on this device."))return;
    var k=prompt("New report type:\n1 = Test & Scope\n2 = Chemical Flush / Descaling\n3 = Field Service","1");
    var key={"1":"test","2":"flush","3":"service"}[(k||"").trim()];if(!key)return;
    backupDraft();S=newReport(key,S.from);embedded=false;dirty=false;lastSaved="";autosave();renderEditor();renderPreview();setStatus();
  };
  document.getElementById("bOpen").onclick=function(){document.getElementById("fOpen").click();};
  document.getElementById("fOpen").onchange=function(e){if(e.target.files[0])openFile(e.target.files[0]);e.target.value="";};
  document.getElementById("bSave").onclick=saveHtml;
  document.getElementById("bRev").onclick=newRev;
  document.getElementById("bPdf").onclick=pdf;
  [].forEach.call(document.querySelectorAll(".seg button"),function(b){b.onclick=function(){
    document.body.className="mode-"+b.dataset.m;
    [].forEach.call(document.querySelectorAll(".seg button"),function(x){x.classList.toggle("on",x===b);});
    renderPreview();
  };});
  window.addEventListener("resize",function(){clearTimeout(init.rh);init.rh=setTimeout(renderPreview,150);});
  window.addEventListener("beforeprint",function(){var sc=document.getElementById("scaler");sc.style.height="auto";});
  window.addEventListener("afterprint",fitScale);
  window.addEventListener("pagehide",function(){if(!embedded)autosave();});
  document.addEventListener("visibilitychange",function(){if(document.hidden&&!embedded)autosave();});
  window.addEventListener("beforeunload",function(e){if(embedded&&dirty){e.preventDefault();e.returnValue="";}});
  renderEditor();renderPreview();setStatus();
})();
</script>
